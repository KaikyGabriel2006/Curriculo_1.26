<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currículo - Kaiky Gabriel Lima Hungarette</title>
  <link rel="stylesheet" href="styles.css"> 
</head>
<body>

  <main class="cv-container">
    <header>
      <div class="header-photo">
        <img id="profile-photo" src="" alt="Foto de Perfil">
      </div>
      <div class="header-main">
        <h1 id="full-name">Carregando...</h1>
        <p class="subtitle" id="prof-title"></p>
      </div>
      <ul class="contact-info" id="contact-info"></ul>
    </header>

    <section>
      <h2>Objetivo e Resumo Profissional</h2>
      <p><strong>Objetivo:</strong> <span id="career-objective"></span></p>
      <p style="margin-top: 0.5rem;" id="prof-summary"></p>
    </section>

    <section id="experience-section" style="display: none;">
      <h2>Experiência Profissional</h2>
      <div id="experience-list"></div>
    </section>

    <section>
      <h2>Formação Acadêmica</h2>
      <div id="education-list"></div>
    </section>

    <section>
      <h2>Projetos Práticos</h2>
      <div id="projects-list"></div>
    </section>

    <section>
      <h2>Habilidades e Ferramentas</h2>
      <div class="tags" id="skills-list"></div>
    </section>

    <div class="grid-2">
      <section>
        <h2>Idiomas</h2>
        <div class="item" id="languages-list"></div>
      </section>

      <section>
        <h2>Informações Adicionais</h2>
        <div class="item" id="additional-info"></div>
      </section>
  </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
